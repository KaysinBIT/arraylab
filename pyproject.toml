[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arraylab-desktop"
version = "0.11.0"
description = "Desktop and headless electrical feed design for isotropic linear and planar arrays"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials>=6.10,<7",
  "matplotlib>=3.10,<4",
]
plotting = ["matplotlib>=3.10,<4"]

[project.scripts]
arraylab = "arraylab.__main__:main"
arraylab-cli = "arraylab.cli:main"

[tool.setuptools.packages.find]
include = ["arraylab*"]

[tool.setuptools.package-data]
"arraylab.sparse2d" = ["resources/*.md", "resources/examples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
