[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arraylab-desktop"
version = "0.26.0.dev2"
description = "Desktop and headless electrical feed design for isotropic linear and planar arrays"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "threadpoolctl>=3.6,<4",
  "psutil==7.2.2",
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials>=6.10,<7",
  "PySide6-WebEngine==6.12.0.140",
  "matplotlib>=3.10,<4",
]
plotting = ["matplotlib>=3.10,<4"]
radar = ["rasterio==1.5.2", "pyproj==3.8.0"]

[project.scripts]
arraylab = "arraylab.__main__:main"
arraylab-cli = "arraylab.cli:main"

[tool.setuptools.packages.find]
include = ["arraylab*"]
exclude = ["arraylab.*.tests", "arraylab.*.tests.*"]

[tool.setuptools.package-data]
"arraylab" = ["resources/icons/*.png", "resources/icons/*.ico"]
"arraylab.sparse2d" = ["resources/*.md", "resources/examples/*.csv"]
"arraylab.features.equation" = ["data/*.json", "data/*.md", "data/presets/*.json"]
"arraylab.shared" = ["resources/radar_scene/*", "resources/radar_scene/src/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
